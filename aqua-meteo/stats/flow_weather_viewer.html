<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIT 3.9 Water Flow Impact Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
       :root {
           --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
           --card-bg: rgba(255, 255, 255, 0.85);
           --card-border: rgba(255, 255, 255, 0.3);
           --primary: #0066ff;
           --secondary: #00b4d8;
           --text-main: #2b2d42;
           --text-muted: #8d99ae;
           --radius: 16px;
           --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
       }
       body {
           font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

           min-height: 100vh;
           margin: 0;
           padding: 40px 20px;

       }
       .container {
           max-width: 1400px;
           margin: 0 auto;
       }
       
       /* Controls Bar: view tabs + duration buttons on the same row */
       .controls-bar {
           display: flex;
           justify-content: center;
           align-items: center;
           gap: 30px;
           padding-bottom: 40px;
           flex-wrap: wrap;
           max-width: 50%;
           margin: 0 auto;
           border-radius: 30px;
           padding: 10px;
           background-color: #ffffff;
       }
       .view-tabs {
           display: flex;
           gap: 0;
       }
       .view-tab {
           padding: 12px 28px;
           border: none;
           font-size: 15px;
           font-weight: 700;
           cursor: pointer;
           transition: all 0.3s ease;

       }
       .view-tab:first-child { border-radius: 30px 0 0 30px; }
       .view-tab:last-child { border-radius: 0 30px 30px 0; }
       .view-tab.active {
           background: var(--primary);
           color: white;
       }
       .view-tab[data-view="temp"].active {
           background: #f37954;
       }
       .view-tab i { margin-right: 6px; }

       .separator {
           width: 1px;
           height: 30px;
           background: #ccc;
       }

       .duration-btns {
           display: flex;
           gap: 10px;
       }
       .btn {
           padding: 12px 24px;
           border: none;
           border-radius: 30px;
           background: var(--card-bg);
           color: var(--text-main);
           font-size: 16px;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.3s ease;

       }
       .btn.active, .btn:hover {
           background: var(--primary);
           color: white;
       }
       
       .dashboard-grid {
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 30px;
           margin-bottom: 30px;
       }
       
       .card {
           background: var(--card-bg);
           backdrop-filter: blur(10px);
           -webkit-backdrop-filter: blur(10px);
           border: 1px solid var(--card-border);
           border-radius: var(--radius);
           padding: 25px;
       }
       
       .full-width {
           grid-column: 1 / -1;
       }
       
       .chart {
           width: 100%;
           height: 400px;
       }
       
       .card-title {
           font-size: 1.25rem;
           font-weight: 700;
           margin-bottom: 20px;
           color: var(--text-main);
       }
       
       .events-container {
           display: flex;
           overflow-x: auto;
           gap: 15px;
           padding-bottom: 15px;
       }
       .events-container::-webkit-scrollbar {
           height: 8px;
       }
       .events-container::-webkit-scrollbar-track {
           background: rgba(0,0,0,0.05);
           border-radius: 10px;
       }
       .events-container::-webkit-scrollbar-thumb {
           background: var(--accent-color, var(--primary));
           border-radius: 10px;
       }
       
       .event-card {
           min-width: 320px;
           background: rgba(255,255,255,0.95);
           border-radius: 12px;
           padding: 15px;
           box-shadow: 0 4px 10px rgba(0,0,0,0.05);
           border: 1px solid #e0e0e0;
           transition: transform 0.2s ease;
       }
       
       .event-card:hover {
       }
       
       .event-chart {
           width: 100%;
           height: 200px;
       }
       .event-header {
           display: flex;
           justify-content: space-between;
           font-weight: 600;
           margin-bottom: 10px;
           color: var(--accent-color, var(--primary));
       }

       /* Premium Stats Section Styling */
       .stats-grid {
           display: grid;
           grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
           gap: 25px;
           margin-top: 30px;
       }
       .stat-card {
           background: #ffffff;
           border-radius: 20px;
           padding: 28px;
           border: 1px solid rgba(0,0,0,0.05);
           box-shadow: 0 15px 35px rgba(0,0,0,0.02);
           transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
           position: relative;
           display: flex;
           flex-direction: column;
       }

       .stat-category-header {
           display: flex;
           align-items: center;
           justify-content: space-between;
           margin-bottom: 25px;
           padding-bottom: 15px;
           border-bottom: 2px solid #f8f9fa;
       }
       .stat-category-title {
           font-size: 1.1rem;
           font-weight: 800;
           color: var(--text-main);
           display: flex;
           align-items: center;
           gap: 12px;
       }
       .stat-category-title i {
           width: 40px;
           height: 40px;
           background: rgba(0, 102, 255, 0.05);
           color: var(--accent-color);
           display: flex;
           align-items: center;
           justify-content: center;
           border-radius: 12px;
           font-size: 1.2rem;
       }
       .stat-count-pill {
           background: #f1f5f9;
           color: #64748b;
           padding: 4px 12px;
           border-radius: 100px;
           font-size: 0.75rem;
           font-weight: 700;
       }
       .stat-metrics {
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 20px;
       }
       .metric-box {
           display: flex;
           flex-direction: column;
           gap: 4px;
       }
       .metric-box.full {
           grid-column: 1 / -1;
           background: rgba(0, 102, 255, 0.03);
           padding: 15px;
           border-radius: 14px;
           margin-bottom: 10px;
       }
       .metric-label {
           color: var(--text-muted);
           font-size: 0.75rem;
           font-weight: 600;
           text-transform: uppercase;
           letter-spacing: 0.5px;
           display: flex;
           align-items: center;
           gap: 6px;
       }
       .metric-value {
           font-size: 1.1rem;
           font-weight: 700;
           color: var(--text-main);
       }
       .metric-box.full .metric-value {
           font-size: 1.8rem;
           color: var(--accent-color);
       }
       .metric-value small {
           font-size: 0.8rem;
           opacity: 0.6;
       }
    </style>
</head>
<body>
    <div class="container">

        <div class="controls-bar">
            <div class="view-tabs">
                <button class="view-tab active" data-view="rain" onclick="switchView('rain')"><i class="fa-solid fa-cloud-rain"></i> Rainfall</button>
                <button class="view-tab" data-view="temp" onclick="switchView('temp')"><i class="fa-solid fa-temperature-high"></i> Temperature</button>
            </div>
            <div class="separator"></div>
            <div class="duration-btns">
                <button class="btn active" onclick="updateDashboard('1d')">1-Day</button>
                <button class="btn" onclick="updateDashboard('3d')">3-Day</button>
                <button class="btn" onclick="updateDashboard('10d')">10-Day</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Time series context -->
            <div class="card full-width">
                <div class="card-title" id="timeseries-title">Continuous Time Series & Selected Events</div>
                <div id="chart-timeseries" class="chart"></div>
            </div>
            
            <!-- Real Examples / Proof -->
            <div class="card full-width" id="events-section" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div class="card-title" id="events-title" style="margin-bottom: 0;">Isolated Events (Proof)</div>
                    <select id="event-year-select" onchange="renderEvents()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.9); font-family: 'Inter', sans-serif; font-weight: 600; color: var(--text-main); cursor: pointer; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <option value="All">All Years</option>
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <div class="events-container" id="events-container">
                </div>
            </div>

            <!-- Summary Bar Chart -->
            <div class="card full-width">
                <div class="card-title" id="summary-title">Average Water Flow by Intensity</div>
                <div id="chart-summary" class="chart"></div>
                <div id="summary-stats"></div>
            </div>
        </div>
    </div>

    <script src="flow_weather_data.js"></script>

    <script>
        const chartSummary = echarts.init(document.getElementById('chart-summary'));
        const chartTime = echarts.init(document.getElementById('chart-timeseries'));
        
        let eventCharts = [];
        let currentDuration = '3d';
        let currentView = 'rain'; // 'rain' or 'temp'

        window.addEventListener('resize', () => {
            chartSummary.resize();
            chartTime.resize();
            eventCharts.forEach(c => c.resize());
        });

        const colors = {
            // Rain palette
            dry: '#e9ecef',
            light: '#90e0ef',
            medium: '#00b4d8',
            heavy: '#0077b6',
            flow: '#03045e',
            // Temperature palette (professional muted tones)
            cold: '#7b9ea8',
            cool: '#d4a574',
            warm: '#f9844a',
            hot: '#a03030'
        };

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.view-tab[data-view="${view}"]`).classList.add('active');
            // Update accent color for scrollbar and event headers
            const accent = view === 'rain' ? 'var(--primary)' : '#f9844a';
            document.documentElement.style.setProperty('--accent-color', accent);
            updateDashboard(currentDuration);
        }

        function updateDashboard(duration) {
            currentDuration = duration;
            // UI Button state
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if(duration === '1d') document.querySelectorAll('.btn')[0].classList.add('active');
            if(duration === '3d') document.querySelectorAll('.btn')[1].classList.add('active');
            if(duration === '10d') document.querySelectorAll('.btn')[2].classList.add('active');

            if (!flowWeatherData || !flowWeatherData.views || !flowWeatherData.views[duration]) {
                return;
            }

            const viewData = flowWeatherData.views[duration][currentView];
            const raw = flowWeatherData.daily_raw;
            let daysNum = 1;
            if(duration === '3d') daysNum = 3;
            if(duration === '10d') daysNum = 10;

            // --- SUMMARY BAR CHART (Dense Statistics) ---
            const iconPaths = {
                // Font Awesome inspired SVG paths
                max: 'path://M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM385 231c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-71-71V376c0 13.3-10.7 24-24 24s-24-10.7-24-24V193.9l-71 71c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9L239 129c9.4-9.4 24.6-9.4 33.9 0L385 231z', // circle-arrow-up
                min: 'path://M256 0a256 256 0 1 0 0 512A256 256 0 1 0 256 0zM127 281c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l71 71V136c0-13.3 10.7-24 24-24s24 10.7 24 24V318.1l71-71c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9L273 383c-9.4 9.4-24.6 9.4-33.9 0L127 281z', // circle-arrow-down
                median: 'path://M0 256C0 114.6 114.6 0 256 0S512 114.6 512 256 397.4 512 256 512 0 397.4 0 256zM160 216c-13.3 0-24 10.7-24 24s10.7 24 24 24H352c13.3 0 24-10.7 24-24s-10.7-24-24-24H160z' // circle-minus
            };

            function getColorForCat(cat) {
                const map = { Light: colors.light, Medium: colors.medium, Heavy: colors.heavy,
                              Cold: colors.cold, Cool: colors.cool, Warm: colors.warm, Hot: colors.hot };
                return map[cat] || '#999';
            }

            const categories = currentView === 'rain' 
                ? ['Light', 'Medium', 'Heavy'] 
                : ['Cold', 'Cool', 'Warm', 'Hot'];

            const summaryLabel = currentView === 'rain'
                ? `Flow Statistics by Rain Intensity (${daysNum}-Day Window)`
                : `Flow Statistics by Temperature Range (${daysNum}-Day Window)`;
            document.getElementById('summary-title').innerText = summaryLabel;

            const s = viewData.summary;

            // Build premium stat grid
            let statsHtml = '<div class="stats-grid">';
            categories.forEach(cat => {
                const mean = s.mean[cat] || 0;
                const min = s.min[cat] || 0;
                const max = s.max[cat] || 0;
                const med = s.median[cat] || 0;
                const cnt = s.count[cat] || 0;
                const icon = currentView === 'rain' ? 'fa-cloud-showers-heavy' : 'fa-thermometer-half';
                const catColor = getColorForCat(cat);
                
                statsHtml += `
                <div class="stat-card">
                    <div class="stat-category-header">
                        <div class="stat-category-title">
                            <i class="fas ${icon}" style="background: ${catColor}15; color: ${catColor}"></i>
                            ${cat}
                        </div>
                        <span class="stat-count-pill">${cnt} Days</span>
                    </div>
                    <div class="stat-metrics">
                        <div class="metric-box full">
                            <span class="metric-label"><i class="fas fa-calculator"></i> Mean Flow</span>
                            <span class="metric-value">${mean} <small>m³</small></span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fas fa-equals"></i> Median</span>
                            <span class="metric-value">${med} <small>m³</small></span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fas fa-arrow-up"></i> Max</span>
                            <span class="metric-value">${max} <small>m³</small></span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fas fa-arrow-down"></i> Min</span>
                            <span class="metric-value">${min} <small>m³</small></span>
                        </div>
                        <div class="metric-box">
                            <span class="metric-label"><i class="fas fa-chart-line"></i> Spread</span>
                            <span class="metric-value">${(max-min).toFixed(1)} <small>m³</small></span>
                        </div>
                    </div>
                </div>`;
            });
            statsHtml += '</div>';
            document.getElementById('summary-stats').innerHTML = statsHtml;

            // Chart: Mean bars + Min/Max error bars + Median scatter
            chartSummary.setOption({
                tooltip: { 
                    trigger: 'axis', 
                    axisPointer: { type: 'shadow' },
                    backgroundColor: 'rgba(255, 255, 255, 0.98)',
                    padding: [12, 15],
                    extraCssText: 'box-shadow: 0 10px 30px rgba(0,0,0,0.12); border-radius: 12px; border: none;',
                    textStyle: { color: '#334155', fontStyle: 'Inter' },
                    formatter: function(params) {
                        const cat = params[0].name;
                        const catColor = getColorForCat(cat);
                        return `
                        <div style="min-width: 140px;">
                            <div style="font-weight: 800; font-size: 14px; margin-bottom: 10px; color: ${catColor}; border-bottom: 2px solid #f1f5f9; padding-bottom: 5px;">${cat} Range</div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span style="opacity: 0.7;">Average:</span>
                                <span style="font-weight: 700;">${s.mean[cat]} m³</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span style="opacity: 0.7;">Median:</span>
                                <span style="font-weight: 700;">${s.median[cat]} m³</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span style="opacity: 0.7;">Peak:</span>
                                <span style="font-weight: 700;">${s.max[cat]} m³</span>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span style="opacity: 0.7;">Size:</span>
                                <span style="font-weight: 700;">${s.count[cat]} Days</span>
                            </div>
                        </div>`;
                    }
                },
                legend: { 
                    top: 10, 
                    icon: 'circle', 
                    itemGap: 25,
                    textStyle: { fontWeight: 700, color: '#64748b', fontSize: 12 },
                    data: ['Average Flow'] 
                },
                grid: { left: '8%', right: '8%', bottom: '10%', top: '22%' },
                xAxis: { 
                    type: 'category', 
                    data: categories, 
                    axisLine: { lineStyle: { color: '#e2e8f0', width: 2 } },
                    axisLabel: { fontWeight: 800, color: '#64748b', margin: 15 }
                },
                yAxis: { 
                    type: 'value', 
                    name: 'Flow (m³)', 
                    min: (value) => Math.floor(value.min * 0.98), // Exaggerate the differences
                    nameTextStyle: { fontWeight: 700, color: '#94a3b8', padding: [0, 0, 10, 0] },
                    splitLine: { lineStyle: { type: 'dashed', color: '#f1f5f9' } },
                    axisLabel: { fontWeight: 600, color: '#94a3b8' }
                },
                series: [
                    {
                        name: 'Average Flow', type: 'bar', barWidth: '40%',
                        data: categories.map(cat => ({
                            value: s.mean[cat] || 0,
                            itemStyle: { 
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: getColorForCat(cat) },
                                    { offset: 1, color: getColorForCat(cat) + 'CC' }
                                ]),
                                borderRadius: [10, 10, 0, 0]
                            }
                        })),
                        label: { show: true, position: 'top', formatter: '{c}', fontSize: 12, fontWeight: 800, color: '#475569', distance: 10 }
                    }
                ]
            }, true);

            // --- TIME SERIES ---
            const markAreas = [];
            if(viewData.events) {
                viewData.events.forEach(eventDate => {
                    const targetIdx = raw.dates.indexOf(eventDate);
                    if(targetIdx === -1) return;
                    const startIdx = Math.max(0, targetIdx - daysNum);
                    const highlightColor = currentView === 'rain' 
                        ? 'rgba(0, 180, 216, 0.2)' 
                        : 'rgba(232, 93, 4, 0.15)';
                    markAreas.push([
                        { xAxis: raw.dates[startIdx], itemStyle: { color: highlightColor } },
                        { xAxis: eventDate }
                    ]);
                });
            }

            const secondarySeries = currentView === 'rain'
                ? { name: 'Rain', type: 'bar', yAxisIndex: 1, data: raw.rainfall, itemStyle: { color: colors.medium, opacity: 0.6 } }
                : { name: 'Temp', type: 'line', yAxisIndex: 1, data: raw.temperature, smooth: true, symbol: 'none', itemStyle: { color: '#e85d04', opacity: 0.7 }, lineStyle: { width: 1.5 } };

            const secondaryYAxis = currentView === 'rain'
                ? { type: 'value', name: 'Rainfall (mm)', inverse: false, max: 'dataMax', splitLine: { show: false } }
                : { type: 'value', name: 'Temp (°C)', splitLine: { show: false } };

            document.getElementById('timeseries-title').innerText = currentView === 'rain'
                ? 'Flow & Rainfall Time Series'
                : 'Flow & Temperature Time Series';

            chartTime.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                legend: { top: 0 },
                dataZoom: [
                    { type: 'inside', start: 95, end: 100 }, 
                    { type: 'slider', start: 95, end: 100, bottom: 0, height: 20 }
                ],
                grid: { left: '5%', right: '5%', bottom: '15%', top: '15%' },
                xAxis: { type: 'category', data: raw.dates, boundaryGap: false },
                yAxis: [
                    { type: 'value', name: 'Flow (m³)', splitLine: { lineStyle: { type: 'dashed', color: '#e2e8f0' } } },
                    secondaryYAxis
                ],
                series: [
                    {
                        name: 'Flow', type: 'line', data: raw.flow,
                        itemStyle: { color: colors.flow },
                        areaStyle: { opacity: 0.1 },
                        markArea: { data: markAreas, itemStyle: { borderWidth: 1 } },
                        smooth: true, symbol: 'none'
                    },
                    secondarySeries
                ]
            }, true);

            // Render Events Cards
            renderEvents();
        }

        function renderEvents() {
            const duration = currentDuration;
            if (!flowWeatherData || !flowWeatherData.views || !flowWeatherData.views[duration]) {
                return;
            }
            
            const viewData = flowWeatherData.views[duration][currentView];
            const raw = flowWeatherData.daily_raw;
            let daysNum = 1;
            if(duration === '3d') daysNum = 3;
            if(duration === '10d') daysNum = 10;

            const eventsContainer = document.getElementById('events-container');
            eventsContainer.innerHTML = '';
            eventCharts.forEach(c => c.dispose());
            eventCharts = [];

            if (viewData.events && viewData.events.length > 0) {
                document.getElementById('events-section').style.display = 'block';
                
                if (currentView === 'rain') {
                    document.getElementById('events-title').innerText = `Proof: ${daysNum} consecutive day(s) of rain (>1mm/day)`;
                } else {
                    document.getElementById('events-title').innerText = `Proof: ${daysNum} consecutive day(s) of high temp (>25°C)`;
                }

                const selectedYear = document.getElementById('event-year-select').value;
                let filteredEvents = viewData.events;
                if (selectedYear !== 'All') {
                    filteredEvents = filteredEvents.filter(e => e.startsWith(selectedYear));
                }

                if (filteredEvents.length === 0) {
                    const label = currentView === 'rain' ? 'rainfall' : 'high temperature';
                    eventsContainer.innerHTML = `<div style="padding: 20px; color: #888; font-weight: 600;">No consecutive ${label} events found for ${selectedYear}.</div>`;
                    return;
                }

                const maxEvents = Math.min(10, filteredEvents.length);
                for(let i=0; i<maxEvents; i++) {
                    const eventDate = filteredEvents[i];
                    const targetIdx = raw.dates.indexOf(eventDate);
                    if(targetIdx < daysNum) continue;

                    const startIdx = targetIdx - daysNum - 1; 
                    const endIdx = Math.min(targetIdx + 2, raw.dates.length - 1);
                    
                    const sliceDates = raw.dates.slice(startIdx, endIdx + 1);
                    const sliceFlow = raw.flow.slice(startIdx, endIdx + 1);
                    const sliceSecondary = currentView === 'rain'
                        ? raw.rainfall.slice(startIdx, endIdx + 1)
                        : raw.temperature.slice(startIdx, endIdx + 1);

                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.innerHTML = `
                        <div class="event-header">
                            <span>Event: ${eventDate}</span>
                        </div>
                        <div id="evt-chart-${i}" class="event-chart"></div>
                    `;
                    eventsContainer.appendChild(card);

                    const secondaryColor = currentView === 'rain' ? colors.medium : colors.warm;
                    const secondaryName = currentView === 'rain' ? 'Rain' : 'Temp';
                    const secondaryType = currentView === 'rain' ? 'bar' : 'line';

                    const currChart = echarts.init(document.getElementById(`evt-chart-${i}`));
                    currChart.setOption({
                        tooltip: { trigger: 'axis' },
                        grid: { left: '15%', right: '10%', top: '15%', bottom: '20%' },
                        xAxis: { type: 'category', data: sliceDates, axisLabel: { formatter: val => val.substring(5) } },
                        yAxis: [
                            { type: 'value', min: 'dataMin', splitLine: { lineStyle: { type: 'dashed' } } },
                            { type: 'value', inverse: false, max: 'dataMax', show: false }
                        ],
                        series: [
                            { name: secondaryName, type: secondaryType, yAxisIndex: 1, data: sliceSecondary, itemStyle: { color: secondaryColor, opacity: 0.8 }, smooth: secondaryType === 'line' },
                            { name: 'Flow', type: 'line', data: sliceFlow, smooth: true, itemStyle: { color: colors.flow, width: 3 }, symbolSize: 6 }
                        ]
                    });
                    eventCharts.push(currChart);
                }
            } else {
                document.getElementById('events-section').style.display = 'none';
            }
        }

        // Initialize on load
        setTimeout(() => {
            if(typeof flowWeatherData !== 'undefined') {
                updateDashboard('3d');
            }
        }, 200);

    </script>
</body>
</html>
